<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>home</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<div class="contaners">
		<div class="top">
			<div class="flipkartlogo">
				<img src="flipkart.png" alt="flipkart">
			</div>
			<div class="search">
				<input type="search" name="search" placeholder="Search for Products" class="searchbar">
				<input type="button" name="button"value="Search" class="button">

			</div>
			<div class="login">
				<input type="submit" name="submit" value="login" class="loginbutton">
				<input type="submit" name="submit" value="cart" class="loginbutton" style="margin-left: 10px;">
			</div>
		</div>
		<div class="allcategories">
			<div class="categories categories1">
				<img src="detergent.webp" alt="detergent">
			</div>
			<div class="categories categories2">
				<img src="electronics.webp" alt="electronics">
			</div>
			<div class="categories categories3">
				<img src="clothing.webp" alt="fashion">
			</div>
			<div class="categories categories4">
				<img src="furniture.webp" alt="furniture">
			</div>
			<div class="categories categories5">
				<img src="washingmachine.webp" alt="washingmachine">
			</div>
			<div class="categories categories6">
				<img src="trips.webp" alt="travel">
			</div>
			<div class="categories categories7">
				<img src="kids.webp" alt="kids">
			</div>
			<div class="categories categories8">
				<img src="bikes.webp" alt="bike">
			</div>
			<div class="categories categories9">
				<img src="mobile.webp" alt="mobile">
			</div>
		</div>
		<div class="banner">
			<img src="banner.webp" alt="banner">
		</div>
		<div class="offer">
			<img src="offer1.webp">
			<img src="offer2.webp">
			<img src="offer3.webp">
		</div>
		<div class="deals">
			<div class="heading">
				<h3>Top Deals</h3>
			</div>

			<div class="deal deal1">
				<img src="shoes.webp" alt="nike">
				<p>NB shoes 80% off</p>
			</div>

			<div class="deal deal2">
				<img src="sports.webp" alt="adidas">
				<p>adidas runner</p>
			</div>

			<div class="deal deal3">
				<img src="uspolo.webp" alt="uspolo">
				<p>polo denmark</p>
			</div>

			<div class="deal deal4">
				<img src="rozers.jpg" alt="rozers">
				<p>us polo denmark</p>
			</div>
			<div class="deal deal5">
				<img src="trousers.webp" alt="cargoes">
				<p>cargo 20% off</p>
			</div>
			<div class="deal deal6">
				<img src="nbshoes.webp" alt="nbshoes">
				<p>shoes 40% off</p>
			</div>
		</div>
		<div class="bottom">
			<div class="link link1">
				<h4>about</h4>
				<p>contace</p>
				<p>about</p>
				<p>careers</p>
				<p>flipkart stories</p>
				<p>press</p>
			</div>
			<div class="link link2">
				<h4>help</h4>
				<p>paymant</p>
				<p>shipping</p>
				<p>cancelltion & return</p>
				<p>faq</p>
				<p>report</p>
			</div>
			<div class="link link3">
				<h4>policy</h4>
				<p>return policy</p>
				<p>Terms Of Use</p>
				<p>Security</p>
				<p>Privacy</p>
				<p>Sitemap</p>
		    </div>
		
	</div>

</body>
</html>
